services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_guestbook
    ports:
      - "5432:5432"
    volumes:
      - portfolio_guestbook_db:/var/lib/postgresql/data

volumes:
  portfolio_guestbook_db:
